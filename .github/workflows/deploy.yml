name: Deploy Fullstack (Node.js Backend & Frontend)

on:
  push:
    branches:
      - main # Trigger otomatis saat push ke branch main
  workflow_dispatch: # Mengizinkan deploy manual melalui tombol "Run workflow" di GitHub Actions

jobs:
  deploy:
    name: Build & Deploy to cPanel Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Kompilasi Frontend
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 2. Deploy Frontend ke public_html
      - name: Deploy Frontend (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'dharmabantenconsultant.com' }}
          username: ${{ secrets.FTP_USERNAME || 'dharmaba1' }}
          password: ${{ secrets.FTP_PASSWORD || 'Dharma26#' }}
          local-dir: ./frontend/dist/
          server-dir: ./public_html/

      # 3. Kompilasi Backend (TypeScript Strapi) & Siapkan Restart Trigger
      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
          echo "!dist/" > .git-ftp-include
          echo "!dist/**" >> .git-ftp-include
          echo "!tmp/restart.txt" >> .git-ftp-include

      # 4. Deploy Backend & Trigger Passenger Restart
      - name: Deploy Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'dharmabantenconsultant.com' }}
          username: ${{ secrets.FTP_USERNAME || 'dharmaba1' }}
          password: ${{ secrets.FTP_PASSWORD || 'Dharma26#' }}
          local-dir: ./backend/
          server-dir: ./backend/
          exclude: |
            **/node_modules/**
            **/.env*
            **/.git*
            **/.cache/**
            **/*.db*
            **/*.log

